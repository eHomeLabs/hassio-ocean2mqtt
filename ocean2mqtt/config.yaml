name: Ocean2MQTT
version: "0.2.4"
slug: ocean2mqtt
description: Passerelle EnOcean ↔ MQTT multimarque, façon Zigbee2MQTT
url: https://github.com/eHomeLabs/Ocean2MQTT
# Image construite par GitHub Actions (dépôt hassio-ocean2mqtt) : rien à compiler chez vous
image: ghcr.io/ehomelabs/{arch}-addon-ocean2mqtt
arch:
  - aarch64
  - amd64
stage: stable
startup: application
boot: auto
init: true
ingress: true
ingress_port: 8080
panel_icon: mdi:access-point-network
panel_title: Ocean2MQTT
hassio_api: true
uart: true
# Lecture seule de la configuration de Home Assistant : reprise des produits de
# NodOcean for HA sans réappairage.
map:
  - type: homeassistant_config
    read_only: true
usb: true
services:
  - mqtt:need
ports:
  8080/tcp: null
ports_description:
  8080/tcp: Interface web hors Home Assistant (désactivée par défaut, l'interface passe par la barre latérale)
options:
  serial_port: /dev/ttyUSB0
  topic_name: name
  log_level: info
  recom: true
schema:
  serial_port: device(subsystem=tty)
  topic_name: list(name|id)
  log_level: list(info|debug)
  recom: bool
  mqtt_host: str?
  mqtt_port: port?
  mqtt_user: str?
  mqtt_password: password?
  web_password: password?
