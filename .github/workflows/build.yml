name: Image de l'add-on

on:
  push:
    branches: [main]
    paths: ["ocean2mqtt/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(sed -n 's/^version: *"\(.*\)"/\1/p' ocean2mqtt/config.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ocean2mqtt
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          build-args: |
            OCEAN2MQTT_VERSION=${{ steps.version.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}
          tags: |
            ghcr.io/ehomelabs/${{ matrix.arch }}-addon-ocean2mqtt:${{ steps.version.outputs.version }}
            ghcr.io/ehomelabs/${{ matrix.arch }}-addon-ocean2mqtt:latest
